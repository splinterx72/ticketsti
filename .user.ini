; Ajustes PHP para cPanel con PHP-FPM / CGI (MultiPHP INI Editor los respeta).
display_errors = Off
log_errors = On
upload_max_filesize = 32M
post_max_size = 34M
max_execution_time = 300
memory_limit = 256M
date.timezone = America/Mexico_City
session.use_strict_mode = 1
session.cookie_httponly = 1
expose_php = Off
